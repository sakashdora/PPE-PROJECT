services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factory_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-factory_safety}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factory_admin} -d ${POSTGRES_DB:-factory_safety}"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build: ../server
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-factory_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-factory_safety}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      EDGE_API_KEY: ${EDGE_API_KEY:?Set EDGE_API_KEY}
      SNAPSHOTS_DIR: /app/snapshots
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3000}
    ports: ["4000:4000"]
    volumes: ["server_snapshots:/app/snapshots"]
  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
    restart: unless-stopped
    depends_on: [server]
    environment:
      PORT: 3000
      INTERNAL_API_URL: http://server:4000
      EDGE_STREAM_URL: http://edge:8080
      FORENSICS_URL: http://forensics:8090
      EDGE_API_KEY: ${EDGE_API_KEY}
    ports: ["3000:3000"]
  edge:
    build: ../edge
    restart: unless-stopped
    depends_on: [server]
    environment:
      SERVER_URL: http://server:4000
      EDGE_API_KEY: ${EDGE_API_KEY}
      FACTORY_ROOT: /app
      MODEL_PATH: /app/models/best_s5.onnx
      DB_PATH: /app/data/outbox.db
      SNAPSHOTS_DIR: /app/data/snapshots
    ports: ["8080:8080"]
    volumes: ["../models:/app/models:ro", "edge_data:/app/data"]
  forensics:
    build: ../edge
    command: ["python", "-m", "app.forensics_server"]
    restart: unless-stopped
    environment:
      MODEL_PATH: /app/models/best_s5.onnx
      EDGE_API_KEY: ${EDGE_API_KEY}
    ports: ["8090:8090"]
    volumes: ["../models:/app/models:ro"]
volumes:
  postgres_data:
  server_snapshots:
  edge_data:
